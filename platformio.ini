; esp32poeLarsBatMon
; Boot-/Fahrzeug-Batteriemonitor auf Waveshare ESP32-S3-ETH (ESP32-S3R8,
; 16MB Flash, 8MB Octal-PSRAM, W5500-Ethernet via SPI, optionales PoE-Modul).
; Liest BLE-Advertisements eines Batterie-BMS aus und stellt die Daten übers
; Netzwerk (PoE-Ethernet) bereit.
;
; W5500 SPI-Pinout (Waveshare ESP32-S3-ETH):
;   CLK=13  MISO=12  MOSI=11  CS=14  IRQ=10  RST=9

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
